
name: Build FreeKiosk APK

on:
  # Push to main automatically triggers a build
  push:
    branches:
      - main

  # Allow manual builds from the Actions page
  workflow_dispatch:

# Minimum permissions required
permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # 1. Download repository source code
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # 3. Install Java JDK 17 and cache Gradle dependencies
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 4. Install Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 5. Install JavaScript dependencies
      - name: Install dependencies
        run: npm ci

      # 6. Build Debug APK
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 7. Upload APK as a downloadable artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeKiosk-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
